<style>
        body {
            font-family: 'Roboto Flex', sans-serif;
            background-color: #f9f9f9;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-focus-ring:focus-within {
            border-color: #005dac;
            box-shadow: 0 0 0 1px #005dac;
        }
        .login-card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>

<body class="flex flex-col min-h-screen bg-surface">
<!-- Top Navigation Shell Suppressed (Transactional Page Rule) -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-xl">
<!-- Logo Section -->
<div class="mb-lg flex flex-col items-center">
<div class="w-24 h-24 mb-md">
<img class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC9jjdQVFgX3uD4uGMNdLaUuJVr2yjSBV3Ww_mzPrGUjuQNv2uvyuH8upimXdu9rknsUh241g9X7P9gZjqb0KcH18wr7-vmA0qZ2-UsQToRZzIoh4qy_yPbyilhgzP9iTWsK-jYVG-Nog-vo2vwzXCil2ZLjKrxcIl3mlpZz68w8gD1_TWQv5WYgVC3qyrFcPMslaY7vei4LvAlKMSfy9E0XPj40l7egph5jMw23Wxlf_RU3Lex1Lu1ag"/>
</div>
<h1 class="font-headline-sm text-headline-sm text-primary text-center tracking-tight">
                Smart Attendance System
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs opacity-80">
                Teacher Login
            </p>
</div>
<!-- Login Form Card -->
<div class="w-full max-w-sm bg-surface-container-lowest p-lg rounded-xl login-card-shadow border border-surface-container">
<form class="space-y-lg" id="loginForm">
<!-- Email Field -->
<div class="relative group">
<label class="absolute left-3 -top-2 px-1 bg-surface-container-lowest font-label-md text-label-md text-primary transition-all" for="email">
                        Email Address
                    </label>
<div class="flex items-center border border-outline-variant rounded-lg p-md input-focus-ring transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mr-sm">mail</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface" id="email" name="email" placeholder="dr.smith@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="relative group">
<label class="absolute left-3 -top-2 px-1 bg-surface-container-lowest font-label-md text-label-md text-on-surface-variant group-focus-within:text-primary transition-all" for="password">
                        Password
                    </label>
<div class="flex items-center border border-outline-variant rounded-lg p-md input-focus-ring transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mr-sm">lock</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passIcon">visibility</span>
</button>
</div>
</div>
<!-- Login Action -->
<div class="pt-base">
<button class="w-full bg-primary text-on-primary py-md rounded-lg font-title-lg text-title-lg shadow-md active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-sm" type="submit">
                        Login
                        <span class="material-symbols-outlined text-[20px]">login</span>
</button>
</div>
<!-- Forgot Password -->
<div class="text-center">
<a class="font-label-lg text-label-lg text-primary hover:underline underline-offset-4 decoration-primary-fixed-dim" href="#">
                        Forgot Password?
                    </a>
</div>
</form>
</div>
<!-- Help / Support Hint -->
<p class="mt-xl font-label-md text-label-md text-on-surface-variant text-center px-lg">
            Need help accessing your account? <br/>Contact the IT Support Desk.
        </p>
</main>
<!-- Footer -->
<footer class="py-lg text-center">
<p class="font-label-md text-label-md text-outline-variant tracking-widest uppercase">
            Smart Attendance v1.0
        </p>
</footer>
<!-- Interactive Script -->
<script>
        function togglePassword() {
            const passInput = document.getElementById('password');
            const passIcon = document.getElementById('passIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                passIcon.innerText = 'visibility';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Visual feedback for interaction
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Success';
                btn.classList.replace('bg-primary', 'bg-emerald-600');
                // Potential redirect logic would go here
            }, 1200);
        });

        // Label highlight logic for Material Design aesthetics
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.relative').querySelector('label').classList.add('text-primary');
                input.closest('.relative').querySelector('label').classList.remove('text-on-surface-variant');
            });
            input.addEventListener('blur', () => {
                input.closest('.relative').querySelector('label').classList.remove('text-primary');
                input.closest('.relative').querySelector('label').classList.add('text-on-surface-variant');
            });
        });
    </script>
</body></html>
