<div class="absolute inset-0 w-full h-full" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_15" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_15');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.querySelector('#animation-container');
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Confetti-like particles for success
const particleCount = 150;
const geometry = new THREE.PlaneGeometry(0.1, 0.1);
const materials = [
    new THREE.MeshBasicMaterial({ color: 0x1976d2, side: THREE.DoubleSide }), // Primary Blue
    new THREE.MeshBasicMaterial({ color: 0x4caf50, side: THREE.DoubleSide }), // Success Green
    new THREE.MeshBasicMaterial({ color: 0xffeb3b, side: THREE.DoubleSide }), // Yellow
    new THREE.MeshBasicMaterial({ color: 0x2196f3, side: THREE.DoubleSide })  // Light Blue
];

const particles = [];
for (let i = 0; i < particleCount; i++) {
    const material = materials[Math.floor(Math.random() * materials.length)];
    const mesh = new THREE.Mesh(geometry, material);
    
    mesh.position.set(
        (Math.random() - 0.5) * 10,
        Math.random() * 10 + 5,
        (Math.random() - 0.5) * 5
    );
    
    mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    
    const velocity = {
        x: (Math.random() - 0.5) * 0.05,
        y: -Math.random() * 0.05 - 0.02,
        z: (Math.random() - 0.5) * 0.05,
        rotation: {
            x: Math.random() * 0.1,
            y: Math.random() * 0.1,
            z: Math.random() * 0.1
        }
    };
    
    particles.push({ mesh, velocity });
    scene.add(mesh);
}

camera.position.z = 5;

function animate() {
    requestAnimationFrame(animate);
    
    particles.forEach(p => {
        p.mesh.position.x += p.velocity.x;
        p.mesh.position.y += p.velocity.y;
        p.mesh.position.z += p.velocity.z;
        
        p.mesh.rotation.x += p.velocity.rotation.x;
        p.mesh.rotation.y += p.velocity.rotation.y;
        p.mesh.rotation.z += p.velocity.rotation.z;
        
        // Reset particles
        if (p.mesh.position.y < -5) {
            p.mesh.position.y = 5;
            p.mesh.position.x = (Math.random() - 0.5) * 10;
        }
    });
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
