<!-- STITCH_SHADER_START:ANIMATION_9 class="absolute inset-0 w-full h-full z-0" -->
<div class="absolute inset-0 w-full h-full z-0" style="display:block;">
<canvas id="shader-canvas-ANIMATION_9" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_9');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;

varying vec2 v_texCoord;

void main() {
    vec2 uv = v_texCoord;
    
    // Create a scanning line effect
    float scanline = sin(uv.y * 20.0 - u_time * 4.0) * 0.5 + 0.5;
    scanline = pow(scanline, 10.0); // Sharpen the line
    
    // Create a pulsing circular detection grid
    vec2 center = vec2(0.5, 0.5);
    float dist = distance(uv, center);
    float ring = sin(dist * 30.0 - u_time * 2.0);
    ring = smoothstep(0.4, 0.5, ring) * smoothstep(0.6, 0.5, ring);
    
    // Digital noise/grid background
    float grid = sin(uv.x * 50.0) * sin(uv.y * 50.0);
    grid = smoothstep(0.98, 1.0, grid);
    
    // Combine colors (Academic Blue theme)
    vec3 color = vec3(0.1, 0.46, 0.82); // Primary Blue #1976d2
    vec3 finalColor = color * (scanline * 0.3 + ring * 0.2 + grid * 0.1 + 0.05);
    
    // Add some "glow" to the scanline
    finalColor += vec3(0.4, 0.7, 1.0) * scanline * 0.5;
    
    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<div class="w-1 bg-primary/40 h-8 animate-[pulse_1s_infinite_100ms]"></div>
<div class="w-1 bg-primary/40 h-10 animate-[pulse_1.2s_infinite_200ms]"></div>
<div class="w-1 bg-primary/40 h-6 animate-[pulse_0.8s_infinite_300ms]"></div>
<div class="w-1 bg-primary/40 h-12 animate-[pulse_1.5s_infinite_400ms]"></div>

</div>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const steps = [
                { id: 'step-1', icon: 'icon-1', duration: 2500, label: 'Detecting Faces...' },
                { id: 'step-2', icon: 'icon-2', duration: 3000, label: 'Recognizing Students...' },
                { id: 'step-3', icon: 'icon-3', duration: 2000, label: 'Marking Attendance...' }
            ];

            let currentProgress = 0;
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');

            async function runSequence() {
                for (let i = 0; i < steps.length; i++) {
                    const step = steps[i];
                    const element = document.getElementById(step.id);
                    const icon = document.getElementById(step.icon);
                    
                    // Activate current step
                    element.classList.add('active');
                    element.classList.remove('bg-surface-container-low');
                    element.classList.add('bg-primary-container/10', 'border-primary/50');
                    icon.classList.add('text-primary', 'animate-spin');
                    icon.textContent = 'sync';

                    // Update Progress over duration
                    const startTime = Date.now();
                    const startProgress = currentProgress;
                    const targetProgress = ((i + 1) / steps.length) * 100;

                    while (Date.now() - startTime < step.duration) {
                        const elapsed = Date.now() - startTime;
                        const factor = elapsed / step.duration;
                        const partial = startProgress + (targetProgress - startProgress) * factor;
                        progressBar.style.width = `${partial}%`;
                        progressText.textContent = `${Math.round(partial)}% Completed`;
                        await new Promise(r => requestAnimationFrame(r));
                    }

                    currentProgress = targetProgress;
                    progressBar.style.width = `${currentProgress}%`;
                    progressText.textContent = `${Math.round(currentProgress)}% Completed`;

                    // Complete current step
                    icon.classList.remove('animate-spin');
                    icon.textContent = 'check_circle';
                    icon.style.fontVariationSettings = "'FILL' 1";
                    element.querySelector('span:last-child').classList.remove('text-on-surface-variant');
                    element.querySelector('span:last-child').classList.add('text-on-surface');
                }

                // Final redirect or success state transition simulation
                setTimeout(() => {
                    progressText.textContent = "Processing Complete";
                    document.querySelector('h1').textContent = "Attendance Captured";
                }, 800);
            }

            // Start logic
            setTimeout(runSequence, 1000);
        });
    </script>
